{% extends "base.html" %}
{% block title %}Page Not Found — {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-24 text-center space-y-4">
  <p class="text-xs uppercase tracking-widest text-terracotta font-semibold">Error 404</p>
  <h1 class="font-serif-editorial text-4xl font-bold text-navy">Chapter Not Found</h1>
  <p class="text-sm text-navy/70">The page or book you are looking for does not exist or has been moved.</p>
  <a href="{{ url_for('home') }}" class="inline-block px-6 py-3 rounded-xl bg-navy text-cream text-sm font-semibold hover:bg-terracotta transition">Return Home</a>
</div>
{% endblock %}
