{% extends "base.html" %}
{% block title %}Server Error — {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-24 text-center space-y-4">
  <p class="text-xs uppercase tracking-widest text-terracotta font-semibold">Error 500</p>
  <h1 class="font-serif-editorial text-4xl font-bold text-navy">Something Went Wrong</h1>
  <p class="text-sm text-navy/70">An unexpected server error occurred. Please try again in a moment.</p>
  <a href="{{ url_for('home') }}" class="inline-block px-6 py-3 rounded-xl bg-navy text-cream text-sm font-semibold hover:bg-terracotta transition">Return Home</a>
</div>
{% endblock %}
